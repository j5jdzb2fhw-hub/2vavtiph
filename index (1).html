<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Замена времени и текста на фото</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; padding:14px; background:#f2f2f0; color:#1c1c1c;
         font-family:-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:600px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
  canvas { width:100%; height:auto; display:block; border-radius:8px; background:#999; }
  canvas.sel { touch-action:none; outline:3px solid #1f5eff; }
  input[type=text], select { width:100%; font-size:17px; padding:11px; border:1px solid #bbb;
         border-radius:8px; background:#fff; color:#1c1c1c; }
  button, label.btn { font-size:16px; padding:12px; border:0; border-radius:8px; background:#1f5eff;
         color:#fff; text-align:center; cursor:pointer; flex:1; }
  button.alt { background:#fff; color:#1c1c1c; border:1px solid #bbb; }
  button.del { flex:0 0 44px; background:#fff; color:#b00; border:1px solid #bbb; }
  input[type=file] { display:none; }
  .row { display:flex; gap:8px; align-items:center; }
  .reg { background:#fff; border:1px solid #ccc; border-radius:8px; padding:10px;
         display:flex; flex-direction:column; gap:8px; }
  .reg b { font-size:14px; }
  #status { font-size:14px; color:#555; min-height:20px; }
  .lbl { font-size:14px; color:#555; }
  @media (prefers-color-scheme: dark) {
    body { background:#161616; color:#eee; }
    input[type=text], select, .reg { background:#222; color:#eee; border-color:#444; }
    button.alt, button.del { background:#222; color:#eee; border-color:#444; }
    #status, .lbl { color:#aaa; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <label class="btn" for="file">Выбрать фото</label>
    <input id="file" type="file" accept="image/*">
  </div>

  <div id="status">Выберите фото, на котором есть время и код.</div>
  <canvas id="cv" width="600" height="400"></canvas>

  <div id="regions" style="display:flex;flex-direction:column;gap:8px"></div>

  <div class="row">
    <button class="alt" id="addTime">+ Время вручную</button>
    <button class="alt" id="addText">+ Текст вручную</button>
  </div>

  <div class="lbl">Какой код искать на фото</div>
  <div class="row">
    <input type="text" id="code" value="184BI04" autocapitalize="characters">
    <button id="redo" style="flex:0 0 auto">Найти заново</button>
  </div>

  <div class="row">
    <button id="now" class="alt">Взять время сейчас</button>
    <button id="save">Сохранить фото</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const FORMATS = ['HH:mm','HH:mm:ss','dd.MM.yyyy','dd.MM.yy','dd.MM.yyyy HH:mm','dd/MM/yyyy','dd-MM-yyyy'];
let base = null, regions = [], stamp = new Date(), mode = null, drag = null, worker = null, uid = 0;

/* ---------- шрифты-кандидаты для подбора по фото ---------- */
const CANDS = [
  {n:'Roboto', f:'Roboto, sans-serif', g:'Roboto'},
  {n:'Системный (SF / Android)', f:'-apple-system, system-ui, sans-serif'},
  {n:'Arial', f:'Arial, sans-serif'},
  {n:'Helvetica', f:'Helvetica, Arial, sans-serif'},
  {n:'Helvetica Neue', f:'"Helvetica Neue", Helvetica, sans-serif'},
  {n:'Segoe UI', f:'"Segoe UI", sans-serif'},
  {n:'Verdana', f:'Verdana, sans-serif'},
  {n:'Tahoma', f:'Tahoma, sans-serif'},
  {n:'Trebuchet MS', f:'"Trebuchet MS", sans-serif'},
  {n:'Courier New', f:'"Courier New", monospace'},
  {n:'Times New Roman', f:'"Times New Roman", serif'},
  {n:'Georgia', f:'Georgia, serif'},
  {n:'Open Sans', f:'"Open Sans", sans-serif', g:'Open Sans'},
  {n:'Inter', f:'Inter, sans-serif', g:'Inter'},
  {n:'Montserrat', f:'Montserrat, sans-serif', g:'Montserrat'},
  {n:'Lato', f:'Lato, sans-serif', g:'Lato'},
  {n:'Noto Sans', f:'"Noto Sans", sans-serif', g:'Noto Sans'},
  {n:'Source Sans', f:'"Source Sans 3", sans-serif', g:'Source Sans 3'},
  {n:'PT Sans', f:'"PT Sans", sans-serif', g:'PT Sans'},
  {n:'Oswald', f:'Oswald, sans-serif', g:'Oswald'},
  {n:'Roboto Mono', f:'"Roboto Mono", monospace', g:'Roboto Mono'},
  {n:'Roboto Condensed', f:'"Roboto Condensed", sans-serif', g:'Roboto Condensed'},
  {n:'Ubuntu', f:'Ubuntu, sans-serif', g:'Ubuntu'},
  {n:'Nunito', f:'Nunito, sans-serif', g:'Nunito'},
  {n:'Fira Sans', f:'"Fira Sans", sans-serif', g:'Fira Sans'},
  {n:'Poppins', f:'Poppins, sans-serif', g:'Poppins'},
  {n:'DM Sans', f:'"DM Sans", sans-serif', g:'DM Sans'},
  {n:'IBM Plex Sans', f:'"IBM Plex Sans", sans-serif', g:'IBM Plex Sans'},
  {n:'Rubik', f:'Rubik, sans-serif', g:'Rubik'},
  {n:'Manrope', f:'Manrope, sans-serif', g:'Manrope'},
  {n:'Work Sans', f:'"Work Sans", sans-serif', g:'Work Sans'}
];
// каждый шрифт грузится отдельной ссылкой, чтобы одна ошибка не ломала остальные
const fontsP = Promise.all(CANDS.filter(c => c.g).map(c => new Promise(res => {
  const l = document.createElement('link'); l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?family=' + c.g.replace(/ /g, '+') + ':wght@400;700&display=swap';
  l.onload = () => Promise.all([document.fonts.load('400 20px "' + c.g + '"'), document.fonts.load('700 20px "' + c.g + '"')]).then(res, res);
  l.onerror = () => res();
  document.head.appendChild(l);
}))).then(() => { try { render(); } catch (e) {} });
const effFont = r => r.pick || r.auto || {c: CANDS[0], b: false};
document.fonts.load('400 20px Roboto').then(() => document.fonts.ready).then(() => render()).catch(() => {});

const status = t => $('status').textContent = t;
const p2 = n => String(n).padStart(2, '0');

function fmtDate(d, f) {
  return f.replace('yyyy', d.getFullYear()).replace('yy', String(d.getFullYear()).slice(-2))
          .replace('dd', p2(d.getDate())).replace('MM', p2(d.getMonth() + 1))
          .replace('HH', p2(d.getHours())).replace('mm', p2(d.getMinutes()))
          .replace('ss', p2(d.getSeconds()));
}

function lev(a, b) {
  const m = Array.from({length: a.length + 1}, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) m[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    m[i][j] = Math.min(m[i-1][j] + 1, m[i][j-1] + 1, m[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return m[a.length][b.length];
}

/* ---------- загрузка фото ---------- */
$('file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const im = new Image();
  im.onload = () => {
    const mx = Math.max(im.naturalWidth, im.naturalHeight), k = mx > 2400 ? 2400 / mx : 1;
    base = document.createElement('canvas');
    base.width = Math.round(im.naturalWidth * k);
    base.height = Math.round(im.naturalHeight * k);
    base.getContext('2d').drawImage(im, 0, 0, base.width, base.height);
    cv.width = base.width; cv.height = base.height;
    stamp = new Date(); regions = [];
    render(); list(); detect();
  };
  im.src = URL.createObjectURL(f);
});

/* ---------- распознавание ---------- */
async function detect() {
  if (!base) return;
  regions = regions.filter(r => r.manual);
  status('Ищу текст на фото… (при первом запуске нужен интернет)');
  try {
    const wk = await getWorker();
    const {data} = await wk.recognize(base);
    const codeN = $('code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    let nt = 0, nc = 0;
    for (const w of data.words || []) {
      const t = w.text.trim(); if (!t) continue;
      let kind = null, fmt = null, m;
      if ((m = t.match(/^\d{1,2}[:;]\d{2}([:;]\d{2})?$/))) { kind = 'time'; fmt = m[1] ? 'HH:mm:ss' : 'HH:mm'; }
      else if ((m = t.match(/^\d{1,2}([.\/-])\d{1,2}\1(\d{2}|\d{4})$/))) {
        kind = 'time'; const s = m[1]; fmt = 'dd' + s + 'MM' + s + (m[2].length === 4 ? 'yyyy' : 'yy');
      } else if (codeN) {
        const n = t.toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (n.length >= 4 && (n.includes(codeN) || lev(n, codeN) <= (codeN.length >= 6 ? 2 : 1))) kind = 'text';
      }
      if (!kind) continue;
      addRegion({kind, fmt, value: '', orig: origText(kind, t), ...box(w.bbox)});
      kind === 'time' ? nt++ : nc++;
    }
    status('Подбираю шрифт по фото…');
    for (const r of regions) if (!r.auto) await fitFont(r);
    list(); render();
    status('Найдено: времени/дат — ' + nt + ', кода — ' + nc +
      (nt && nc ? '. Впишите свои данные ниже.' : '. Чего не хватает — выделите вручную кнопками ниже.'));
  } catch (err) {
    status('Не удалось распознать (нужен интернет для первого запуска). Выделите места вручную.');
  }
}

async function getWorker() {
  if (!worker) {
    worker = await Tesseract.createWorker('eng', 1, {
      logger: m => { if (m.status === 'recognizing text') status('Распознаю: ' + Math.round(m.progress * 100) + '%'); }
    });
    await worker.setParameters({tessedit_pageseg_mode: '11'});
  }
  return worker;
}

/* исходная строка, которая была на фото (нужна для сравнения шрифтов) */
function origText(kind, t) {
  t = (t || '').trim().replace(/\s+/g, '');
  if (kind === 'time') return t.replace(/;/g, ':').replace(/[^0-9:.\/-]/g, '');
  const n = t.toUpperCase().replace(/[^A-Z0-9]/g, '');
  const cn = $('code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (cn && (!n || n.includes(cn) || lev(n, cn) <= (cn.length >= 6 ? 2 : 1))) return cn;
  return t;
}

async function ocrRegion(r) {
  const wk = await getWorker();
  await wk.setParameters({tessedit_pageseg_mode: '7'});
  try {
    const {data} = await wk.recognize(base, {rectangle: {left: r.x, top: r.y, width: r.w, height: r.h}});
    return data.text;
  } finally { await wk.setParameters({tessedit_pageseg_mode: '11'}); }
}

/* подбор шрифта: рисуем текст каждым шрифтом и сравниваем с оригиналом на фото */
async function fitFont(r) {
  try {
    await fontsP;
    const bg = r.bg || (r.bg = bgColor(r));
    r.fg = r.fg || (r.fg = inkColor(r, bg));
    const ink = r.ink || (r.ink = inkBox(r, bg));
    let s = r.orig;
    if (!s) s = origText(r.kind, await ocrRegion(r));
    if (!s || s.length < 2) return;
    r.auto = bestFont(s, ink, bg);
  } catch (e) {}
}

function bestFont(s, ink, bg) {
  const iw = ink.x1 - ink.x0, ih = ink.y1 - ink.y0;
  const k = Math.min(1, 48 / ih), cw = Math.max(8, Math.round(iw * k)), ch = Math.max(8, Math.round(ih * k));
  const oc = document.createElement('canvas'); oc.width = cw; oc.height = ch;
  const ox = oc.getContext('2d', {willReadFrequently: true});
  ox.drawImage(base, ink.x0, ink.y0, iw, ih, 0, 0, cw, ch);
  const od = ox.getImageData(0, 0, cw, ch).data, O = new Float32Array(cw * ch);
  let mx = 1;
  for (let i = 0; i < O.length; i++) {
    const v = Math.abs(od[i*4] - bg[0]) + Math.abs(od[i*4+1] - bg[1]) + Math.abs(od[i*4+2] - bg[2]);
    O[i] = v; if (v > mx) mx = v;
  }
  for (let i = 0; i < O.length; i++) O[i] = Math.min(1, O[i] / mx);
  const cc = document.createElement('canvas'); cc.width = cw; cc.height = ch;
  const c = cc.getContext('2d', {willReadFrequently: true});
  let best = null;
  for (const cand of CANDS) for (const b of [false, true]) {
    const wt = b ? 'bold ' : '';
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.font = wt + '100px ' + cand.f;
    const m = c.measureText(s);
    const asc = m.actualBoundingBoxAscent, hh = asc + m.actualBoundingBoxDescent;
    const ww = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
    if (hh <= 0 || ww <= 0) continue;
    const fs = 100 * ch / hh, sx = cw / (ww * fs / 100);
    c.fillStyle = '#fff'; c.fillRect(0, 0, cw, ch);
    c.fillStyle = '#000';
    c.font = wt + fs + 'px ' + cand.f;
    c.setTransform(sx, 0, 0, 1, 0, 0);
    c.fillText(s, m.actualBoundingBoxLeft * fs / 100, asc * fs / 100);
    const d = c.getImageData(0, 0, cw, ch).data;
    let e = 0;
    for (let i = 0; i < O.length; i++) e += Math.abs((255 - d[i*4]) / 255 - O[i]);
    e = e / O.length + 0.12 * Math.abs(Math.log(sx));   // штраф, если ширина сильно не совпадает
    if (!best || e < best.e) best = {c: cand, b, e};
  }
  return best;
}

function box(b) {
  const x = Math.max(0, Math.round(b.x0)), y = Math.max(0, Math.round(b.y0));
  return {x, y, w: Math.max(2, Math.min(base.width - x, Math.round(b.x1 - b.x0))),
                h: Math.max(2, Math.min(base.height - y, Math.round(b.y1 - b.y0)))};
}
function addRegion(r) { r.id = ++uid; regions.push(r); }

/* ---------- цвета ---------- */
function bgColor(r) {
  const c = base.getContext('2d'), W = base.width, H = base.height;
  const x0 = Math.max(0, r.x - 6), y0 = Math.max(0, r.y - 6);
  const x1 = Math.min(W, r.x + r.w + 6), y1 = Math.min(H, r.y + r.h + 6);
  const d = c.getImageData(x0, y0, x1 - x0, y1 - y0).data, w = x1 - x0;
  const R = [], G = [], B = [];
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
    if (x >= r.x - 3 && x < r.x + r.w + 3 && y >= r.y - 3 && y < r.y + r.h + 3) continue;
    const i = ((y - y0) * w + (x - x0)) * 4; R.push(d[i]); G.push(d[i+1]); B.push(d[i+2]);
  }
  const med = a => { a.sort((p, q) => p - q); return a[a.length >> 1] || 0; };
  return [med(R), med(G), med(B)];
}
function inkColor(r, bg) {
  const d = base.getContext('2d').getImageData(r.x, r.y, r.w, r.h).data, a = [];
  for (let i = 0; i < d.length; i += 4)
    a.push([Math.abs(d[i]-bg[0]) + Math.abs(d[i+1]-bg[1]) + Math.abs(d[i+2]-bg[2]), d[i], d[i+1], d[i+2]]);
  a.sort((p, q) => q[0] - p[0]);
  const n = Math.min(a.length, Math.max(5, Math.floor(a.length * 0.12))), s = [0, 0, 0];
  for (let i = 0; i < n; i++) { s[0] += a[i][1]; s[1] += a[i][2]; s[2] += a[i][3]; }
  return s.map(v => Math.round(v / n));
}

/* ---------- отрисовка ---------- */
function render() {
  if (!base) return;
  ctx.drawImage(base, 0, 0);
  const sc = 1;
  for (const r of regions) {
    const bg = r.bg || (r.bg = bgColor(r)), fg = r.fg || (r.fg = inkColor(r, bg));
    const ink = r.ink || (r.ink = inkBox(r, bg));
    const pad = 3;
    const cx0 = Math.min(r.x, ink.x0) - pad, cy0 = Math.min(r.y, ink.y0) - pad;
    const cx1 = Math.max(r.x + r.w, ink.x1) + pad, cy1 = Math.max(r.y + r.h, ink.y1) + pad;
    ctx.fillStyle = `rgb(${bg})`;
    ctx.fillRect(cx0, cy0, cx1 - cx0, cy1 - cy0);
    const txt = r.kind === 'time' ? fmtDate(stamp, r.fmt) : r.value;
    if (!txt) continue;
    const EF = effFont(r), fam = EF.c.f, wt = EF.b ? 'bold ' : '';
    ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    // размер: высота цифр нового шрифта = высоте знаков оригинала
    ctx.font = wt + '100px ' + fam;
    const a100 = ctx.measureText('0').actualBoundingBoxAscent || 72;
    const fs = (ink.y1 - ink.y0) / a100 * 100 * sc;
    ctx.font = wt + fs + 'px ' + fam;
    const m = ctx.measureText(txt);
    const inkW = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
    ctx.fillStyle = `rgb(${fg})`;
    ctx.save();
    ctx.translate(ink.x0 + (r.kind === 'text' ? (r.dx || 0) : 0), ink.y1);   // левый нижний угол оригинала (+ сдвиг для своего текста)
    if (r.kind === 'time' && inkW > 0) {
      const s = (ink.x1 - ink.x0) / inkW;        // та же ширина, что у оригинала
      if (s > 0.6 && s < 1.6) ctx.scale(s, 1);
    }
    ctx.fillText(txt, m.actualBoundingBoxLeft, 0);
    ctx.restore();
  }
}

/* точные границы знаков оригинала */
function inkBox(r, bg) {
  const W = base.width, H = base.height;
  const x0 = Math.max(0, r.x - 2), y0 = Math.max(0, r.y - 2);
  const x1 = Math.min(W, r.x + r.w + 2), y1 = Math.min(H, r.y + r.h + 2);
  const d = base.getContext('2d').getImageData(x0, y0, x1 - x0, y1 - y0).data, w = x1 - x0;
  let mx = 0; const dist = new Array(d.length / 4);
  for (let i = 0; i < dist.length; i++) {
    const v = Math.abs(d[i*4] - bg[0]) + Math.abs(d[i*4+1] - bg[1]) + Math.abs(d[i*4+2] - bg[2]);
    dist[i] = v; if (v > mx) mx = v;
  }
  const th = Math.max(40, mx * 0.35);
  let ax = 1e9, ay = 1e9, bx = -1, by = -1;
  for (let i = 0; i < dist.length; i++) if (dist[i] > th) {
    const x = i % w, y = (i / w) | 0;
    if (x < ax) ax = x; if (x > bx) bx = x; if (y < ay) ay = y; if (y > by) by = y;
  }
  if (bx < 0) return {x0: r.x, y0: r.y, x1: r.x + r.w, y1: r.y + r.h};
  return {x0: x0 + ax, y0: y0 + ay, x1: x0 + bx + 1, y1: y0 + by + 1};
}

/* ---------- список полей ---------- */
function list() {
  const box = $('regions'); box.innerHTML = '';
  regions.forEach(r => {
    const el = document.createElement('div'); el.className = 'reg';
    const row = document.createElement('div'); row.className = 'row';
    const title = document.createElement('b');
    title.textContent = r.kind === 'time' ? 'Время / дата (берётся с устройства)' : 'Ваш текст вместо кода';
    row.appendChild(title);
    const del = document.createElement('button'); del.className = 'del'; del.textContent = '✕';
    del.onclick = () => { regions = regions.filter(x => x !== r); list(); render(); };
    row.appendChild(del);
    el.appendChild(row);
    if (r.kind === 'time') {
      const s = document.createElement('select');
      const fl = FORMATS.includes(r.fmt) ? FORMATS : [r.fmt, ...FORMATS];
      fl.forEach(f => { const o = document.createElement('option'); o.value = f; o.textContent = fmtDate(stamp, f) + '  (' + f + ')'; if (f === r.fmt) o.selected = true; s.appendChild(o); });
      s.onchange = () => { r.fmt = s.value; render(); };
      el.appendChild(s);
    } else {
      const i = document.createElement('input'); i.type = 'text'; i.placeholder = 'Впишите свои данные'; i.value = r.value;
      i.oninput = () => { r.value = i.value; render(); };
      el.appendChild(i);
      const lb = document.createElement('div'); lb.className = 'lbl'; lb.textContent = 'Сдвиг текста по горизонтали';
      el.appendChild(lb);
      const mv = document.createElement('div'); mv.className = 'row';
      const L = document.createElement('button'); L.className = 'alt'; L.textContent = '◀'; L.style.flex = '0 0 44px';
      const R = document.createElement('button'); R.className = 'alt'; R.textContent = '▶'; R.style.flex = '0 0 44px';
      const sl = document.createElement('input'); sl.type = 'range'; sl.style.flex = '1';
      const lim = Math.round(base.width / 2);
      sl.min = -lim; sl.max = lim; sl.step = 1; sl.value = r.dx || 0;
      const setDx = v => { r.dx = Math.max(-lim, Math.min(lim, v)); sl.value = r.dx; render(); };
      sl.oninput = () => setDx(+sl.value);
      L.onclick = () => setDx((r.dx || 0) - 1);
      R.onclick = () => setDx((r.dx || 0) + 1);
      mv.append(L, sl, R);
      el.appendChild(mv);
    }
    const fl2 = document.createElement('div'); fl2.className = 'lbl';
    fl2.textContent = r.auto ? 'Шрифт подобран по фото: ' + r.auto.c.n + (r.auto.b ? ' (жирный)' : '') : 'Шрифт по фото не определён, используется Roboto';
    el.appendChild(fl2);
    const fr = document.createElement('div'); fr.className = 'row';
    const fs2 = document.createElement('select');
    const o0 = document.createElement('option'); o0.value = 'auto'; o0.textContent = 'Авто'; fs2.appendChild(o0);
    CANDS.forEach((c, ix) => { const o = document.createElement('option'); o.value = ix; o.textContent = c.n; fs2.appendChild(o); });
    fs2.value = r.pick ? CANDS.indexOf(r.pick.c) : 'auto';
    const bl = document.createElement('label'); bl.className = 'lbl'; bl.style.flex = '0 0 auto';
    const bc = document.createElement('input'); bc.type = 'checkbox'; bc.checked = effFont(r).b;
    bl.append(bc, ' жирный');
    fs2.onchange = () => { r.pick = fs2.value === 'auto' ? null : {c: CANDS[+fs2.value], b: bc.checked}; bc.checked = effFont(r).b; render(); };
    bc.onchange = () => { const e = effFont(r); r.pick = {c: e.c, b: bc.checked}; fs2.value = CANDS.indexOf(r.pick.c); render(); };
    fr.append(fs2, bl);
    el.appendChild(fr);
    box.appendChild(el);
  });
}

/* ---------- ручное выделение ---------- */
function startMode(m) {
  if (!base) return status('Сначала выберите фото.');
  mode = m; cv.classList.add('sel');
  status('Проведите пальцем по фото, чтобы обвести ' + (m === 'time' ? 'время' : 'текст') + '.');
}
$('addTime').onclick = () => startMode('time');
$('addText').onclick = () => startMode('text');
const pt = e => { const b = cv.getBoundingClientRect(); return {x: (e.clientX - b.left) * cv.width / b.width, y: (e.clientY - b.top) * cv.height / b.height}; };
cv.addEventListener('pointerdown', e => { if (!mode) return; drag = {a: pt(e), b: pt(e)}; cv.setPointerCapture(e.pointerId); e.preventDefault(); });
cv.addEventListener('pointermove', e => {
  if (!drag) return; drag.b = pt(e); render();
  ctx.strokeStyle = '#1f5eff'; ctx.lineWidth = Math.max(2, cv.width / 300);
  ctx.strokeRect(Math.min(drag.a.x, drag.b.x), Math.min(drag.a.y, drag.b.y), Math.abs(drag.b.x - drag.a.x), Math.abs(drag.b.y - drag.a.y));
});
cv.addEventListener('pointerup', () => {
  if (!drag) return;
  const x = Math.round(Math.min(drag.a.x, drag.b.x)), y = Math.round(Math.min(drag.a.y, drag.b.y));
  const w = Math.round(Math.abs(drag.b.x - drag.a.x)), h = Math.round(Math.abs(drag.b.y - drag.a.y));
  drag = null;
  if (w > 8 && h > 8) {
    addRegion({kind: mode, fmt: 'HH:mm', value: '', manual: true, x, y, w: Math.min(w, base.width - x), h: Math.min(h, base.height - y)});
    const nr = regions[regions.length - 1];
    mode = null; cv.classList.remove('sel'); list(); status('Область добавлена. Подбираю шрифт…');
    fitFont(nr).then(() => { list(); render(); status('Область добавлена.'); });
  }
  render();
});

/* ---------- прочее ---------- */
$('redo').onclick = detect;
$('now').onclick = () => { stamp = new Date(); list(); render(); };
$('save').onclick = () => {
  if (!base) return;
  render();
  cv.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'photo.jpg'; a.click(); }, 'image/jpeg', 0.95);
};
